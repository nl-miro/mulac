[package]
name = "mulac-kernel"
version = "0.3.0"
edition = "2024"

[features]
default = []

[dependencies]
inbox = { path = "../libs/inbox", version = "0.3.0", registry = "margo", default-features = false, features = ["diesel", "amqp"], package = "mulac-inbox" }
commanding = { path = "../libs/commanding", version = "0.3.0", registry = "margo", default-features = false, package = "mulac-commanding" }
eventing = { path = "../libs/eventing", version = "0.3.0", registry = "margo", default-features = false, package = "mulac-eventing" }
outbox = { path = "../libs/outbox", version = "0.3.0", registry = "margo", default-features = false, features = ["diesel", "amqp"], package = "mulac-outbox" }
mulac_diesel = { path = "../libs/mulac_diesel", version = "0.3.0", registry = "margo", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }
tokio-util = "0.7"
tracing = "0.1"
chrono = "0.4"
lapin = "4.5.0"

[dev-dependencies]
uuid = { version = "1", features = ["v7", "serde"] }
diesel = { version = "2", features = ["postgres", "r2d2", "uuid", "serde_json"] }
