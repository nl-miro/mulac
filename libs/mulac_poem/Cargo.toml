[package]
name = "mulac_poem"
version.workspace = true
edition.workspace = true

[features]
default = ["diesel"]
diesel = ["mulac_inbox_api/diesel", "mulac_outbox_api?/diesel"]
commanding = ["dep:mulac_commanding_api"]
eventing = ["dep:mulac_eventing_api"]
outbox = ["dep:mulac_outbox_api"]

[dependencies]
mulac_commanding_api = { workspace = true, features = ["tokio"], optional = true }
mulac_eventing_api = { workspace = true, features = ["tokio"], optional = true }
mulac_inbox_api = { workspace = true, features = ["tokio"] }
mulac_outbox_api = { workspace = true, features = ["tokio"], optional = true }
poem = { version = "3", default-features = false }
poem-openapi = { version = "5", default-features = false }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
mulac_commanding_api = { workspace = true, features = ["testing", "tokio"] }
mulac_eventing_api = { workspace = true, features = ["testing", "tokio"] }
inbox = { path = "../inbox", package = "mulac-inbox" }
mulac_inbox_api = { workspace = true, features = ["testing", "tokio"] }
outbox = { path = "../outbox", package = "mulac-outbox" }
mulac_outbox_api = { workspace = true, features = ["testing", "tokio"] }
poem = { version = "3", features = ["test"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "poem_inbox"
required-features = ["diesel"]

[[example]]
name = "poem_outbox"
required-features = ["diesel", "outbox"]
